name: Diagnóstico (temporário)

on:
  workflow_dispatch:

jobs:
  sal:
    runs-on: ubuntu-latest
    steps:
      - name: Resposta do Search-a-licious e do produto
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          UA = {"User-Agent": "RadarShrinkflationPT/0.1 (diagnostico)"}
          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60))
          q = 'countries_tags:"en:portugal" AND categories_tags:"en:sausages"'
          for fields in ("code,product_name,ingredients_text,quantity,product_quantity", None):
              params = {"q": q, "langs": "pt,en", "page_size": 2, "page": 1}
              if fields: params["fields"] = fields
              d = get("https://search.openfoodfacts.org/search?" + urllib.parse.urlencode(params))
              print("FIELDS", fields, "COUNT", d.get("count"))
              for h in d.get("hits", [])[:2]:
                  print(json.dumps({k: v for k, v in h.items() if "ingredient" in k or k in ("code", "product_name", "quantity", "product_quantity")}, ensure_ascii=False)[:1500])
                  code = h.get("code")
              print("ALL KEYS", sorted(d.get("hits", [{}])[0].keys())[:120])
          p = get(f"https://world.openfoodfacts.org/api/v2/product/{code}?fields=code,ingredients_text_pt,ingredients_text,quantity")
          print("PRODUCT", json.dumps(p, ensure_ascii=False)[:1500])
          PY
